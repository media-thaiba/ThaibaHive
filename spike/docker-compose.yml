services:
  postgres:
    image: postgres:16-alpine
    container_name: thaibahive_spike_pg16
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: spike_root_password
      POSTGRES_DB: spike_hostel_db
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
