apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: thaibahive-staging

resources:
  - ../../base

commonLabels:
  environment: staging

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
    target:
      kind: HorizontalPodAutoscaler

images:
  - name: thaibahive/thaibahive-web
    newTag: v3.37.0

configMapGenerator:
  - name: thaibahive-config
    behavior: merge
    literals:
      - NEXT_PUBLIC_APP_URL=https://staging.thaibahive.example.com
      - NODE_ENV=production

secretGenerator:
  - name: thaibahive-secrets
    behavior: merge
    envs:
      - .env.staging