apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: thaibahive-production

resources:
  - ../../base

commonLabels:
  environment: production

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
    target:
      kind: HorizontalPodAutoscaler

images:
  - name: thaibahive/thaibahive-web
    newTag: v3.38.0

configMapGenerator:
  - name: thaibahive-config
    behavior: merge
    literals:
      - NEXT_PUBLIC_APP_URL=https://thaibahive.example.com
      - NODE_ENV=production

secretGenerator:
  - name: thaibahive-secrets
    behavior: merge
    envs:
      - .env.production