apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: thaibahive-platform
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  environment: production
          - git:
              repoURL: https://github.com/asnk633/ThaibaHive.git
              revision: HEAD
              directories:
                - path: charts/*
  template:
    metadata:
      name: 'thaibahive-{{path.basename}}-{{name}}'
      namespace: argocd
    spec:
      project: thaibahive
      source:
        repoURL: https://github.com/asnk633/ThaibaHive.git
        targetRevision: HEAD
        path: '{{path}}'
        helm:
          valueFiles:
            - values.yaml
            - values-{{name}}.yaml
          parameters:
            - name: image.tag
              value: v3.37.0
      destination:
        server: '{{server}}'
        namespace: thaibahive-{{name}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thaibahive-staging
  namespace: argocd
spec:
  project: thaibahive
  source:
    repoURL: https://github.com/asnk633/ThaibaHive.git
    targetRevision: HEAD
    path: charts/thaibahive-web
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
      parameters:
        - name: image.tag
          value: v3.38.0
        - name: replicaCount
          value: "2"
        - name: autoscaling.minReplicas
          value: "2"
        - name: autoscaling.maxReplicas
          value: "5"
  destination:
    server: https://kubernetes.default.svc
    namespace: thaibahive-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thaibahive-production
  namespace: argocd
spec:
  project: thaibahive
  source:
    repoURL: https://github.com/asnk633/ThaibaHive.git
    targetRevision: HEAD
    path: charts/thaibahive-web
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
      parameters:
        - name: image.tag
          value: v3.38.0
        - name: replicaCount
          value: "3"
        - name: autoscaling.minReplicas
          value: "3"
        - name: autoscaling.maxReplicas
          value: "20"
  destination:
    server: https://kubernetes.default.svc
    namespace: thaibahive-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m