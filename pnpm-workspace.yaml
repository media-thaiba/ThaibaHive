packages:
  - "packages/*"

# Build-script allowlist. pnpm v11+ uses `allowBuilds`; pnpm <=10 uses
# `onlyBuiltDependencies`. Both are kept for cross-version CI compatibility
# (gateway-security-gate pins pnpm 9, other lanes run latest).
# These native packages REQUIRE their install scripts to run (esbuild/swc
# binary download, better-sqlite3 native build, sharp libvips, protobufjs
# codegen, unrs-resolver binary link, @firebase/util).
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - "@firebase/util"
  - "@swc/core"
  - protobufjs
  - sharp
  - unrs-resolver

overrides:
  "brace-expansion@2": ">=2.1.7"
  "brace-expansion@4": ">=5.0.12"
  "brace-expansion@5": ">=5.0.12"
  nanoid: ">=3.3.8"
  postcss: ">=8.4.49"
  "@grpc/grpc-js": ">=1.14.5"
  "@fastify/busboy": ">=3.2.1"
  browserslist: ">=4.28.7"
  sharp: ">=0.33.5"
  qs: ">=6.16.0"
  source-map-js: ">=1.2.2"
  uuid: "^11.1.1"
  "exceljs>uuid": "^11.1.1"