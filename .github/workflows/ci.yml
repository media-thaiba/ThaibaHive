name: ThaibaHive CI

on:
  push:
    branches: [ main, master, 'audit/**' ]
  pull_request:
    branches: [ main, master, 'audit/**' ]

env:
  NODE_OPTIONS: "--max-old-space-size=6144"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-ci:
    name: Next.js Web CI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm lint

      - name: Dependency vulnerability audit
        run: pnpm audit --prod --audit-level high

      - name: Type check
        run: pnpm typecheck

      - name: Security & RBAC AST Scans
        run: |
          pnpm security:rbac
          pnpm gateway:scan
          pnpm security:tenants
          pnpm identity:scan
          pnpm compliance:verify
          pnpm compliance:scan

      - name: Database Parity & Migration Check
        run: |
          pnpm premigrate
          pnpm db:migrate
          pnpm db:replica:check
        env:
          DATABASE_URL: file:./test.db

      - name: Generate ephemeral CI test secrets
        run: |
          echo "AUTH_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run unit & integration tests
        run: pnpm test
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          AUTH_JWT_SECRET: ${{ env.AUTH_JWT_SECRET }}
          DATABASE_URL: file:./test.db
          CI: "true"

      - name: Build check
        run: pnpm build
        env:
          AUTH_JWT_SECRET: ${{ env.AUTH_JWT_SECRET }}
          DATABASE_URL: file:./test.db
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NODE_ENV: production

      - name: Verify SQLite database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: file:./test.db

      - name: Check SQLite migrations are up to date
        run: |
          pnpm db:generate
          git diff --exit-code drizzle/*.sql 2>/dev/null || (echo "❌ SQLite migrations are out of date. Run 'pnpm db:generate' and commit the changes." && exit 1)

      - name: Check PostgreSQL migrations are up to date
        run: |
          pnpm db:generate:pg
          git diff --exit-code drizzle/postgres/*.sql 2>/dev/null || (echo "❌ PostgreSQL migrations are out of date. Run 'pnpm db:generate:pg' and commit the changes." && exit 1)

  postgres-ci:
    name: PostgreSQL 16 Production Parity Gate
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_postgres_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup ephemeral test secrets
        run: |
          echo "AUTH_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run PostgreSQL migrations
        run: |
          pnpm premigrate
          pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/test_postgres_db

      - name: Verify PostgreSQL columns & schema drift
        run: |
          pnpm db:verify:columns
          pnpm test packages/db/__tests__/schema-drift.test.ts
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/test_postgres_db

      - name: Run PostgreSQL Auth, Tenant & Schema Parity test suites
        run: |
          pnpm test packages/auth/ packages/db/
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          AUTH_JWT_SECRET: ${{ env.AUTH_JWT_SECRET }}
          DATABASE_URL: postgres://postgres:password@localhost:5432/test_postgres_db
          CI: "true"

  platform-simulations:
    name: Platform OS Simulation (${{ matrix.module }})
    runs-on: ubuntu-24.04
    needs: [web-ci, postgres-ci]
    strategy:
      fail-fast: false
      matrix:
        module:
          - fee
          - alumni
          - supply
          - neuro
          - vision
          - twin
          - docgen
          - eco
          - facility
          - copilot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup ephemeral test secrets
        run: |
          echo "AUTH_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "RECEIPT_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "HEALTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "METRICS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "BIOMETRIC_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TENANT_ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.module }} simulation harness
        run: pnpm ${{ matrix.module }}:simulate
        env:
          AUTH_JWT_SECRET: ${{ env.AUTH_JWT_SECRET }}
          RECEIPT_SIGNING_KEY: ${{ env.RECEIPT_SIGNING_KEY }}
          PII_ENCRYPTION_KEY: ${{ env.PII_ENCRYPTION_KEY }}
          HEALTH_SECRET: ${{ env.HEALTH_SECRET }}
          METRICS_SECRET: ${{ env.METRICS_SECRET }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          BIOMETRIC_MASTER_KEY: ${{ env.BIOMETRIC_MASTER_KEY }}
          TENANT_ENCRYPTION_MASTER_KEY: ${{ env.TENANT_ENCRYPTION_MASTER_KEY }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}

  e2e-build:
    name: E2E Standalone Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral CI test secrets
        run: |
          echo "AUTH_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "HEALTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "METRICS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "RECEIPT_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MDM_ENROLLMENT_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PAYMENT_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SYSTEM_UPDATE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "BIOMETRIC_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TENANT_ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DR_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CACHE_PURGE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build Next.js Web App (Standalone)
        run: pnpm run build
        env:
          AUTH_JWT_SECRET: ${{ env.AUTH_JWT_SECRET }}
          HEALTH_SECRET: ${{ env.HEALTH_SECRET }}
          METRICS_SECRET: ${{ env.METRICS_SECRET }}
          PII_ENCRYPTION_KEY: ${{ env.PII_ENCRYPTION_KEY }}
          RECEIPT_SIGNING_KEY: ${{ env.RECEIPT_SIGNING_KEY }}
          MDM_ENROLLMENT_TOKEN: ${{ env.MDM_ENROLLMENT_TOKEN }}
          PAYMENT_ENCRYPTION_KEY: ${{ env.PAYMENT_ENCRYPTION_KEY }}
          SYSTEM_UPDATE_SECRET: ${{ env.SYSTEM_UPDATE_SECRET }}
          BIOMETRIC_MASTER_KEY: ${{ env.BIOMETRIC_MASTER_KEY }}
          TENANT_ENCRYPTION_MASTER_KEY: ${{ env.TENANT_ENCRYPTION_MASTER_KEY }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          DR_SECRET: ${{ env.DR_SECRET }}
          CACHE_PURGE_SECRET: ${{ env.CACHE_PURGE_SECRET }}
          DATABASE_URL: file:./dev.db
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NODE_ENV: production

      - name: Copy public and static assets to standalone output
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Package standalone build as tarball (preserves symlinks)
        run: |
          tar -czf e2e-standalone.tar.gz \
            --exclude='.env' --exclude='.env.*' \
            --exclude='*/.env' --exclude='*/.env.*' \
            -C .next standalone

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-standalone
          path: e2e-standalone.tar.gz
          if-no-files-found: error
          retention-days: 1

  e2e-tests:
    name: Playwright E2E Tests (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.shardCount }})
    runs-on: ubuntu-24.04
    needs: [web-ci, e2e-build]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
        shardCount: [3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral CI test secrets
        run: |
          echo "AUTH_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "HEALTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "METRICS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "RECEIPT_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MDM_ENROLLMENT_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PAYMENT_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SYSTEM_UPDATE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "BIOMETRIC_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TENANT_ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DR_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CACHE_PURGE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Download standalone build artifact
        uses: actions/download-artifact@v4
        with:
          name: e2e-standalone

      - name: Extract standalone build (symlink-preserving)
        run: |
          mkdir -p .next
          tar -xzf e2e-standalone.tar.gz -C .next
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/server
          node -e "const fs=require('fs');const dir=process.cwd()+'/.next/standalone/node_modules/@libsql';if(!fs.existsSync(dir))throw new Error('@libsql missing in standalone node_modules');console.log('OK runtime standalone modules verified')"
          echo "Standalone build verified with symlinks intact: .next/standalone/server.js"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run database migrations for E2E tests
        run: pnpm db:migrate
        env:
          DATABASE_URL: file:${{ github.workspace }}/dev.db

      - name: Run E2E tests (${{ matrix.browser }} shard ${{ matrix.shard }}/${{ matrix.shardCount }})
        run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.shardCount }}
        env:
          CI: true
          DATABASE_URL: file:${{ github.workspace }}/dev.db
          AUTH_JWT_SECRET: ${{ env.AUTH_JWT_SECRET }}
          HEALTH_SECRET: ${{ env.HEALTH_SECRET }}
          METRICS_SECRET: ${{ env.METRICS_SECRET }}
          PII_ENCRYPTION_KEY: ${{ env.PII_ENCRYPTION_KEY }}
          RECEIPT_SIGNING_KEY: ${{ env.RECEIPT_SIGNING_KEY }}
          MDM_ENROLLMENT_TOKEN: ${{ env.MDM_ENROLLMENT_TOKEN }}
          PAYMENT_ENCRYPTION_KEY: ${{ env.PAYMENT_ENCRYPTION_KEY }}
          SYSTEM_UPDATE_SECRET: ${{ env.SYSTEM_UPDATE_SECRET }}
          BIOMETRIC_MASTER_KEY: ${{ env.BIOMETRIC_MASTER_KEY }}
          TENANT_ENCRYPTION_MASTER_KEY: ${{ env.TENANT_ENCRYPTION_MASTER_KEY }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          DR_SECRET: ${{ env.DR_SECRET }}
          CACHE_PURGE_SECRET: ${{ env.CACHE_PURGE_SECRET }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  load-tests:
    name: k6 CI Load & Stress Tests
    runs-on: ubuntu-24.04
    needs: [web-ci, e2e-build]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral CI test secrets
        run: |
          echo "AUTH_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "HEALTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "METRICS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "RECEIPT_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MDM_ENROLLMENT_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PAYMENT_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SYSTEM_UPDATE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "BIOMETRIC_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TENANT_ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DR_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CACHE_PURGE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Download standalone build artifact
        uses: actions/download-artifact@v4
        with:
          name: e2e-standalone

      - name: Extract standalone build (symlink-preserving)
        run: |
          mkdir -p .next
          tar -xzf e2e-standalone.tar.gz -C .next
          test -f .next/standalone/server.js

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run database migrations for load tests
        run: pnpm db:migrate
        env:
          DATABASE_URL: file:${{ github.workspace }}/dev.db

      - name: Seed database for load tests
        run: pnpm db:seed
        env:
          DATABASE_URL: file:${{ github.workspace }}/dev.db

      - name: Start standalone server and execute k6 load tests
        run: |
          node .next/standalone/server.js &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"
          
          # Wait for server readiness
          npx wait-on -t 30000 http://localhost:3000/api/health || sleep 5

          # Generate valid JWT signed with current AUTH_JWT_SECRET
          TOKEN=$(node scripts/generate-loadtest-token.js)

          mkdir -p k6-reports

          # Run all 4 k6 test scripts with threshold assertions (k6 fails automatically if thresholds are breached)
          echo "Running k6 Attendance Check-in test..."
          BASE_URL=http://localhost:3000 AUTH_TOKEN=$TOKEN VUS=50 DURATION=10s k6 run --summary-export=k6-reports/summary-attendance.json load-tests/attendance-checkin.js

          echo "Running k6 Exam Tabulation test..."
          BASE_URL=http://localhost:3000 AUTH_TOKEN=$TOKEN VUS=50 DURATION=10s k6 run --summary-export=k6-reports/summary-tabulation.json load-tests/exam-tabulation.js

          echo "Running k6 Finance Ledger test..."
          BASE_URL=http://localhost:3000 AUTH_TOKEN=$TOKEN VUS=50 DURATION=10s k6 run --summary-export=k6-reports/summary-ledger.json load-tests/finance-ledger.js

          echo "Running k6 BI Analytics test..."
          BASE_URL=http://localhost:3000 AUTH_TOKEN=$TOKEN VUS=50 DURATION=10s k6 run --summary-export=k6-reports/summary-analytics.json load-tests/bi-analytics.js
          
          kill $SERVER_PID || true
        env:
          PORT: 3000
          DATABASE_URL: file:${{ github.workspace }}/dev.db
          AUTH_JWT_SECRET: ${{ env.AUTH_JWT_SECRET }}
          HEALTH_SECRET: ${{ env.HEALTH_SECRET }}
          METRICS_SECRET: ${{ env.METRICS_SECRET }}
          PII_ENCRYPTION_KEY: ${{ env.PII_ENCRYPTION_KEY }}
          RECEIPT_SIGNING_KEY: ${{ env.RECEIPT_SIGNING_KEY }}
          MDM_ENROLLMENT_TOKEN: ${{ env.MDM_ENROLLMENT_TOKEN }}
          PAYMENT_ENCRYPTION_KEY: ${{ env.PAYMENT_ENCRYPTION_KEY }}
          SYSTEM_UPDATE_SECRET: ${{ env.SYSTEM_UPDATE_SECRET }}
          BIOMETRIC_MASTER_KEY: ${{ env.BIOMETRIC_MASTER_KEY }}
          TENANT_ENCRYPTION_MASTER_KEY: ${{ env.TENANT_ENCRYPTION_MASTER_KEY }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          DR_SECRET: ${{ env.DR_SECRET }}
          CACHE_PURGE_SECRET: ${{ env.CACHE_PURGE_SECRET }}
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload k6 load test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-load-test-reports
          path: k6-reports/
          retention-days: 30

  mobile-ci:
    name: Flutter Mobile CI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: thaibahive_mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze mobile code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run mobile unit tests
        run: flutter test
