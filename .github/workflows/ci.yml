name: ThaibaHive CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-ci:
    name: Next.js Web CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm lint

      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high || true

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build check
        run: pnpm build
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET || 'ci-build-secret-min-32-chars-thaibahive-placeholder' }}
          DATABASE_URL: file:./test.db
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NODE_ENV: production

      - name: Verify SQLite database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: file:./test.db

      - name: Check SQLite migrations are up to date
        run: |
          pnpm db:generate
          git diff --exit-code drizzle/*.sql 2>/dev/null || (echo "❌ SQLite migrations are out of date. Run 'pnpm db:generate' and commit the changes." && exit 1)

      - name: Check PostgreSQL migrations are up to date
        run: |
          pnpm db:generate:pg
          git diff --exit-code drizzle/postgres/*.sql 2>/dev/null || (echo "❌ PostgreSQL migrations are out of date. Run 'pnpm db:generate:pg' and commit the changes." && exit 1)

  e2e-tests:
    name: Playwright E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Web App (Standalone)
        run: pnpm run build
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET || 'ci-build-secret-min-32-chars-thaibahive-placeholder' }}
          DATABASE_URL: file:./dev.db
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NODE_ENV: production

      - name: Copy public and static assets to standalone output
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests (${{ matrix.browser }})
        run: pnpm exec playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          DATABASE_URL: file:${{ github.workspace }}/dev.db
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET || 'ci-build-secret-min-32-chars-thaibahive-placeholder' }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  load-tests:
    name: k6 CI Load & Stress Tests
    runs-on: ubuntu-latest
    needs: web-ci
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Web App (Standalone)
        run: pnpm run build
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET || 'ci-build-secret-min-32-chars-thaibahive-placeholder' }}
          DATABASE_URL: file:./dev.db
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NODE_ENV: production

      - name: Copy public and static assets to standalone output
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Seed database for load tests
        run: pnpm db:seed
        env:
          DATABASE_URL: file:${{ github.workspace }}/dev.db

      - name: Start standalone server and execute k6 load tests
        run: |
          node .next/standalone/server.js &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"
          
          # Wait for server readiness
          npx wait-on -t 30000 http://localhost:3000/api/health || sleep 5

          # Generate or use test admin JWT
          TOKEN="eyJhbGciOiJIUzI1NiJ9.eyJzdGFmZklkIjoiMzRjNDUyNTMtOTQxNi00NTEyLTlmYjYtMTc5ZTI1N2UzNDZiIiwiZW1haWwiOiJhZG1pbkB0aGFpYmFoaXZlLmxvY2FsIiwicm9sZSI6InN1cGVyX2FkbWluIiwiZW1wbG95ZWVJZCI6IkVNUDAwMSIsIm5hbWUiOiJUZXN0IEFkbWluIiwidG9rZW5WZXJzaW9uIjowLCJleHAiOjE3ODc2NDYxNDcsImlhdCI6MTc4NzA0MTM0N30.DufQEiRtbpjNxAzMiEFrMmtqhHmaByeVSShwqTicYm8"

          mkdir -p k6-reports

          # Run all 4 k6 test scripts with threshold assertions (k6 fails automatically if thresholds are breached)
          echo "Running k6 Attendance Check-in test..."
          BASE_URL=http://localhost:3000 AUTH_TOKEN=$TOKEN VUS=50 DURATION=10s k6 run --summary-export=k6-reports/summary-attendance.json load-tests/attendance-checkin.js

          echo "Running k6 Exam Tabulation test..."
          BASE_URL=http://localhost:3000 AUTH_TOKEN=$TOKEN VUS=50 DURATION=10s k6 run --summary-export=k6-reports/summary-tabulation.json load-tests/exam-tabulation.js

          echo "Running k6 Finance Ledger test..."
          BASE_URL=http://localhost:3000 AUTH_TOKEN=$TOKEN VUS=50 DURATION=10s k6 run --summary-export=k6-reports/summary-ledger.json load-tests/finance-ledger.js

          echo "Running k6 BI Analytics test..."
          BASE_URL=http://localhost:3000 AUTH_TOKEN=$TOKEN VUS=50 DURATION=10s k6 run --summary-export=k6-reports/summary-analytics.json load-tests/bi-analytics.js
          
          kill $SERVER_PID || true
        env:
          PORT: 3000
          DATABASE_URL: file:${{ github.workspace }}/dev.db
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET || 'ci-build-secret-min-32-chars-thaibahive-placeholder' }}
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload k6 load test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-load-test-reports
          path: k6-reports/
          retention-days: 30

  mobile-ci:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd thaibahive_mobile_app
          flutter pub get

      - name: Analyze mobile code
        run: |
          cd thaibahive_mobile_app
          flutter analyze

      - name: Run mobile unit tests
        run: |
          cd thaibahive_mobile_app
          flutter test

      - name: Build release APK
        run: |
          cd thaibahive_mobile_app
          flutter build apk --release --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Test production backup strategy
        run: |
          echo "Testing backup strategy..."
          # Test database backup in CI environment
          cd packages/db
          pnpm backup:test
          # Test mobile app data backup
          cd ../thaibahive_mobile_app
          pnpm test:backup
        env:
          DATABASE_URL: sqlite://prod.db
          BACKUP_STORAGE_PATH: ./tmp/backups
