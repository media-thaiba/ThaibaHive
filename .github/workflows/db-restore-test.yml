name: Weekly Database Restore Quality Gate

on:
  schedule:
    # Runs weekly every Sunday at 04:00 UTC (1 hour after Sunday backup)
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force restore drill"
        required: false
        default: "true"

jobs:
  db-restore-drill:
    name: PostgreSQL Automated Restore & Row-Count Drill
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: scratch_restore_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client

      - name: Validate backup & AWS credentials
        run: |
          missing=()
          [ -z "${{ secrets.BACKUP_S3_BUCKET }}" ] && missing+=("BACKUP_S3_BUCKET")
          [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && missing+=("AWS_ACCESS_KEY_ID")
          [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && missing+=("AWS_SECRET_ACCESS_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required AWS backup restore secrets: ${missing[*]}"
            exit 1
          fi

      - name: Download, verify checksum, and restore into scratch database
        env:
          TARGET_DATABASE_URL: postgres://postgres:password@localhost:5432/scratch_restore_db
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: db-backups
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: chmod +x scripts/db/restore-backup.sh && bash scripts/db/restore-backup.sh

      - name: Validate database schema & row-count integrity
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/scratch_restore_db
        run: pnpm db:verify:restore
