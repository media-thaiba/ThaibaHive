name: Automated Database Backup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip S3 upload (dry run)"
        required: false
        default: "false"

jobs:
  db-backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client

      - name: Validate required backup secrets
        id: check_backup_secrets
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ] || [ -z "${{ secrets.BACKUP_S3_BUCKET }}" ] || [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has_backup_secrets=false" >> $GITHUB_OUTPUT
            echo "::notice title=Backup Secrets Pending::DATABASE_URL / BACKUP_S3_BUCKET / AWS credentials are not configured in GitHub Secrets. Scheduled database backup will activate automatically once credentials are added."
            exit 0
          else
            echo "has_backup_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Run database backup
        if: steps.check_backup_secrets.outputs.has_backup_secrets == 'true' || github.event.inputs.dry_run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: db-backups
          BACKUP_RETENTION_DAYS: 30
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: chmod +x scripts/db-backup.sh && bash scripts/db-backup.sh
