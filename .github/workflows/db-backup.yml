name: Automated Database Backup

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip S3 upload (dry run)"
        required: false
        default: "false"

jobs:
  db-backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pg_dump
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Run database backup
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' && secrets.DATABASE_URL != '' && secrets.BACKUP_S3_BUCKET != '' && secrets.AWS_ACCESS_KEY_ID != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: db-backups
          BACKUP_RETENTION_DAYS: 30
        run: chmod +x scripts/db-backup.sh && bash scripts/db-backup.sh

      - name: Skipped notice
        if: ${{ (github.event.inputs.dry_run || 'false') == 'true' || secrets.DATABASE_URL == '' || secrets.BACKUP_S3_BUCKET == '' || secrets.AWS_ACCESS_KEY_ID == '' }}
        run: echo "Skipping backup upload (dry run or missing AWS/DATABASE_URL secrets in repository environment)."
