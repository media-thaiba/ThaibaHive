name: Automated Database Backup

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip S3 upload (dry run)"
        required: false
        default: "false"

jobs:
  db-backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client

      - name: Validate required backup secrets
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          missing=()
          [ -z "${{ secrets.DATABASE_URL }}" ] && missing+=("DATABASE_URL")
          [ -z "${{ secrets.BACKUP_S3_BUCKET }}" ] && missing+=("BACKUP_S3_BUCKET")
          [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && missing+=("AWS_ACCESS_KEY_ID")
          [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && missing+=("AWS_SECRET_ACCESS_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required backup secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: db-backups
          BACKUP_RETENTION_DAYS: 30
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: chmod +x scripts/db-backup.sh && bash scripts/db-backup.sh
