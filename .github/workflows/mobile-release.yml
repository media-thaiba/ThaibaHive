name: Mobile Release Pipeline (Android)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (draft or published)'
        required: true
        default: 'draft'

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-release:
    name: Build Android Release (.aab & .apk)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      has_android_release: ${{ steps.check_keystore.outputs.has_keystore }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release signing credentials
        id: check_keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "::notice title=Android Keystore Not Configured::ANDROID_KEYSTORE_BASE64 is not set in GitHub Secrets. Skipping production release packaging. (Debug/test APK validation is active under Flutter Mobile CI Quality Gate)."
          else
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java JDK 17
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: |
          cd thaibahive_mobile_app
          flutter pub get

      - name: Decode Android Keystore
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > thaibahive_mobile_app/upload-keystore.jks

      - name: Build Android App Bundle (.aab)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: |
          cd thaibahive_mobile_app
          flutter build appbundle --release --split-debug-info=build/app/outputs/symbols

      - name: Build Android Release APK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: |
          cd thaibahive_mobile_app
          flutter build apk --release

      - name: Verify Release APK Signing Certificate Integrity
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: |
          APK_PATH="thaibahive_mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          echo "Verifying signing certificate of $APK_PATH..."
          
          CERT_OUTPUT=$(apksigner verify --print-certs "$APK_PATH")
          echo "$CERT_OUTPUT"
          
          # Fail if APK was signed with a debug certificate
          if echo "$CERT_OUTPUT" | grep -iq "Android Debug"; then
            echo "::error::Release APK is signed with an insecure DEBUG certificate! Production release requires valid keystore."
            exit 1
          fi
          
          # Fail if no signer certificate is present
          if ! echo "$CERT_OUTPUT" | grep -iq "Signer #1"; then
            echo "::error::Release APK verification failed: No valid signature found."
            exit 1
          fi
          
          echo "Production release signing certificate verified successfully."

      - name: Upload Android App Bundle artifact
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thaibahive-android-release-aab
          path: thaibahive_mobile_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload Android Release APK artifact
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thaibahive-android-release-apk
          path: thaibahive_mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Cleanup sensitive signing files
        if: always() && steps.check_keystore.outputs.has_keystore == 'true'
        run: |
          rm -f thaibahive_mobile_app/upload-keystore.jks

  create-github-release:
    name: Create GitHub Release Draft
    needs: [build-android-release]
    if: needs.build-android-release.outputs.has_android_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: thaibahive-android-release-aab
          path: release-artifacts/

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: thaibahive-android-release-apk
          path: release-artifacts/

      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-artifacts/*
          title: ThaibaHive Android Release ${{ github.ref_name }}
          body: |
            ## ThaibaHive Android Production Release ${{ github.ref_name }}

            ### Highlights
            - Signed Android App Bundle (`app-release.aab`) ready for Google Play Console submission
            - Direct-install Release APK (`app-release.apk`) for device testing and distribution
            - FCM push notification capability enabled
            - Background Isolate offline sync engine operational
            - WCAG 2.1 AA accessibility compliant UI components
