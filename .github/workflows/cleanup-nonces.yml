name: Nonce Cleanup

on:
  schedule:
    # Run daily at 02:00 UTC (7:30 IST)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  cleanup-nonces:
    name: Purge Expired Nonces
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          missing=()
          [ -z "${{ secrets.NEXT_PUBLIC_APP_URL }}" ] && missing+=("NEXT_PUBLIC_APP_URL")
          [ -z "${{ secrets.CRON_SECRET }}" ] && missing+=("CRON_SECRET")
          [ -z "${{ secrets.SYSTEM_ADMIN_SESSION_TOKEN }}" ] && missing+=("SYSTEM_ADMIN_SESSION_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets for nonce cleanup: ${missing[*]}"
            exit 1
          fi

      - name: Invoke nonce cleanup endpoint
        run: |
          APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          SESSION_TOKEN="${{ secrets.SYSTEM_ADMIN_SESSION_TOKEN }}"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$APP_URL/api/system/cleanup-nonces" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Authorization: Bearer $SESSION_TOKEN" \
            -H "Cookie: thaibahive_session=$SESSION_TOKEN" || echo "000")

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Nonce cleanup failed with HTTP $RESPONSE against $APP_URL"
            exit 1
          fi
          echo "✅ Nonce cleanup completed successfully (HTTP $RESPONSE)"
