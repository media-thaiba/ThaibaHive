name: Flutter Mobile CI Quality Gate

on:
  push:
    branches: [ main, master, develop, 'feature/*', 'audit/**' ]
    paths:
      - 'thaibahive_mobile_app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [ main, master, develop, 'audit/**' ]
    paths:
      - 'thaibahive_mobile_app/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter Analyze & Test (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: thaibahive_mobile_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter Unit Tests
        run: flutter test --coverage

      # The runner disk fills up during `flutter build apk` (job died twice with
      # "No space left on device" in the build step); reclaim unused preinstalls.
      - name: Free disk space for Android build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images
          sudo docker image prune -af || true
          df -h /

      - name: Build Debug APK Quality Check
        run: flutter build apk --debug

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flutter-coverage
          path: thaibahive_mobile_app/coverage/
          retention-days: 3
