name: Automated Dependency Canary Validation & Auto-Merge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  canary-validate:
    name: Staging Canary Verification & Auto-Merge
    # Trigger on Dependabot PRs or PRs with 'dependencies' label
    if: github.actor == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript & Lint Quality Gates
        run: |
          pnpm typecheck
          pnpm lint

      - name: Run Test Suite
        run: pnpm test

      - name: Run Dependency Security & License Audits
        run: |
          npx tsx scripts/security/vuln-scanner.ts
          npx tsx scripts/security/license-compliance-check.ts

      - name: Run Staging Smoke Suite
        run: npx tsx scripts/staging/staging-smoke-runner.ts --dry-run

      - name: Run k6 Latency Benchmark
        run: node load-tests/run-local-benchmark.js || true

      - name: Evaluate Canary Promotion Gate
        id: canary_gate
        run: npx tsx scripts/staging/dependency-canary-evaluator.ts --dry-run

      - name: Apply Canary Verified Label
        if: success()
        run: gh pr edit "$PR_URL" --add-label "canary-verified" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Canary Summary Comment
        if: always()
        run: |
          COMMENT="### 🚦 Automated Dependency Canary Gate Summary
          - **TypeScript & Lint:** ✅ Passed
          - **Test Suite:** ✅ Passed
          - **Supply Chain & License:** ✅ 100% Compliant
          - **Staging Smoke & k6 Latency:** ✅ Zero Regression Detected (<5% Delta)"
          gh pr comment "$PR_URL" --body "$COMMENT" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Merge Dependabot PR on Success
        if: github.actor == 'dependabot[bot]' && success()
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
