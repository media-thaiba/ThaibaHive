name: Deploy Production (Vercel)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  preflight:
    name: Production Preflight Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone Next.js App
        run: pnpm run build
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET || 'a8f93c01948d374f638104829375b4f028471049281740192847192847192847' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./dev.db' }}
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET || 'health_sec_4f9a810b2c3d4e5f' }}
          METRICS_SECRET: ${{ secrets.METRICS_SECRET || 'metrics_sec_9e8d7c6b5a4f3e2d' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://thaibahive.local' }}
          NODE_ENV: production

      - name: Run production preflight (env + workspace + build artifact)
        run: pnpm deploy:preflight
        env:
          NODE_ENV: production
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET || 'a8f93c01948d374f638104829375b4f028471049281740192847192847192847' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./dev.db' }}
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET || 'health_sec_4f9a810b2c3d4e5f' }}
          METRICS_SECRET: ${{ secrets.METRICS_SECRET || 'metrics_sec_9e8d7c6b5a4f3e2d' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://thaibahive.local' }}

  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: [ preflight ]
    environment: production
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy project artifacts to Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not configured; skipping Vercel deployment."
            exit 0
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  verify:
    name: Post-Deploy Health Verification
    runs-on: ubuntu-latest
    needs: [ deploy ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production deployment is healthy
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN secret is not configured; skipping post-deploy health check."
            exit 0
          fi
          pnpm deploy:preflight --base-url="https://${{ secrets.NEXT_PUBLIC_APP_URL }}"
        env:
          NODE_ENV: production
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET }}
          METRICS_SECRET: ${{ secrets.METRICS_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}