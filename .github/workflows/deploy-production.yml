name: Deploy Production (Vercel)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

permissions:
  contents: read

env:
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  preflight:
    name: Production Preflight Gate
    runs-on: ubuntu-24.04
    outputs:
      cli_enabled: ${{ steps.check_mode.outputs.cli_enabled }}
    steps:
      - name: Check deployment mode
        id: check_mode
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.AUTH_JWT_SECRET }}" ]; then
            echo "cli_enabled=false" >> $GITHUB_OUTPUT
            echo "::notice title=Native Vercel Git Integration Active::VERCEL_TOKEN / production secrets are not configured in GitHub Actions Secrets. Production deployments are managed automatically via Vercel Git Integration (Dashboard: https://vercel.com). Skipping GitHub Actions Vercel CLI pipeline."
          else
            echo "cli_enabled=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check_mode.outputs.cli_enabled == 'true'
        uses: actions/checkout@v4

      - name: Install pnpm
        if: steps.check_mode.outputs.cli_enabled == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        if: steps.check_mode.outputs.cli_enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Validate required production secrets
        if: steps.check_mode.outputs.cli_enabled == 'true'
        run: |
          missing=()
          [ -z "${{ secrets.AUTH_JWT_SECRET }}" ] && missing+=("AUTH_JWT_SECRET")
          [ -z "${{ secrets.DATABASE_URL }}" ] && missing+=("DATABASE_URL")
          [ -z "${{ secrets.HEALTH_SECRET }}" ] && missing+=("HEALTH_SECRET")
          [ -z "${{ secrets.METRICS_SECRET }}" ] && missing+=("METRICS_SECRET")
          [ -z "${{ secrets.NEXT_PUBLIC_APP_URL }}" ] && missing+=("NEXT_PUBLIC_APP_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required production secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        if: steps.check_mode.outputs.cli_enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability audit
        if: steps.check_mode.outputs.cli_enabled == 'true'
        run: pnpm audit --prod --audit-level high

      - name: Run security & RBAC verification gates
        if: steps.check_mode.outputs.cli_enabled == 'true'
        run: |
          pnpm security:tenants
          pnpm security:requireauth
          pnpm security:rbac

      - name: Build standalone Next.js App
        if: steps.check_mode.outputs.cli_enabled == 'true'
        run: pnpm run build
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET }}
          METRICS_SECRET: ${{ secrets.METRICS_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NODE_ENV: production

      - name: Run production preflight (env + workspace + build artifact)
        if: steps.check_mode.outputs.cli_enabled == 'true'
        run: pnpm deploy:preflight
        env:
          NODE_ENV: production
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET }}
          METRICS_SECRET: ${{ secrets.METRICS_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-24.04
    needs: [ preflight ]
    if: needs.preflight.outputs.cli_enabled == 'true'
    environment: production
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy project artifacts to Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not configured; skipping Vercel deployment."
            exit 0
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  verify:
    name: Post-Deploy Health Verification
    runs-on: ubuntu-24.04
    needs: [ preflight, deploy ]
    if: needs.preflight.outputs.cli_enabled == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production deployment is healthy
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN secret is not configured; skipping post-deploy health check."
            exit 0
          fi
          APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"
          if [[ "$APP_URL" != http* ]]; then
            APP_URL="https://${APP_URL}"
          fi
          pnpm deploy:preflight --base-url="$APP_URL"
        env:
          NODE_ENV: production
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET }}
          METRICS_SECRET: ${{ secrets.METRICS_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}