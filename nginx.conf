# ThaibaHive Production Nginx Configuration
# Supports WebSocket, SSE, HTTP/2, TLS termination, rate limiting

# ─── Rate Limiting Zones ─────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=search:10m rate=30r/s;

# ─── Upstream Definitions ────────────────────────────────────────────────
upstream thaibahive_backend {
    least_conn;
    server thaibahive-web:3000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream thaibahive_websocket {
    least_conn;
    server thaibahive-web:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ─── Main Server Block ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ─── SSL Configuration ────────────────────────────────────────────────
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── Security Headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:;" always;

    # ─── Rate Limiting ────────────────────────────────────────────────────
    limit_req zone=api burst=200 nodelay;

    # ─── Static Assets (Long-term Cache) ──────────────────────────────────
    location /_next/static/ {
        proxy_pass http://thaibahive_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 365d;
    }

    location /public/ {
        proxy_pass http://thaibahive_backend;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
        expires 30d;
    }

    # ─── WebSocket Endpoint ───────────────────────────────────────────────
    location /api/chat/ws {
        limit_req zone=ws burst=20 nodelay;

        proxy_pass http://thaibahive_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # Disable caching for WebSocket
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ─── SSE Endpoint ─────────────────────────────────────────────────────
    location /api/chat/sse {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://thaibahive_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;

        # SSE headers
        add_header Content-Type "text/event-stream";
        add_header Cache-Control "no-cache";
        add_header Connection "keep-alive";
        add_header X-Accel-Buffering "no";
    }

    # ─── Search API (Stricter Rate Limit) ────────────────────────────────
    location /api/search {
        limit_req zone=search burst=50 nodelay;
        proxy_pass http://thaibahive_backend;
        include proxy_params;
    }

    # ─── Auth Endpoints (Strictest Rate Limit) ──────────────────────────
    location ~ ^/api/auth/(login|signup|forgot-password|reset-password) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://thaibahive_backend;
        include proxy_params;
    }

    # ─── Mobile Handoff Nonce (Public, No Rate Limit) ────────────────────
    location /api/auth/mobile-handoff/nonce {
        proxy_pass http://thaibahive_backend;
        include proxy_params;
    }

    # ─── Health & Metrics (No Rate Limit, Internal) ─────────────────────
    location /api/system/health {
        proxy_pass http://thaibahive_backend;
        include proxy_params;
        access_log off;
    }

    location /api/system/metrics {
        # Allow from Prometheus scrape IPs only
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://thaibahive_backend;
        include proxy_params;
        access_log off;
    }

    # ─── Default Proxy ───────────────────────────────────────────────────
    location / {
        proxy_pass http://thaibahive_backend;
        include proxy_params;

        # Handle WebSocket upgrade for any path
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ─── Map for WebSocket Connection Header ────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

